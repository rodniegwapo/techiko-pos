<template>
  <style>
      #root { position: absolute; inset: 0; font-family: "Inter", sans-serif; }
      .cap { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; opacity: 0; overflow: visible; }
      .cap span { display: inline-block; max-width: 1500px; background: rgba(16, 35, 26, 0.86); color: #ffffff; font-weight: 600; font-size: 38px; line-height: 1.3; padding: 10px 26px; border-radius: 14px; }
  </style>
  <div data-hf-id="hf-bpls" id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-caption-zone>
    <div data-hf-id="hf-j46l" id="cap-0" class="cap"><span data-hf-id="hf-3g7t">At the end of a busy</span></div>
    <div data-hf-id="hf-g4x0" id="cap-1" class="cap"><span data-hf-id="hf-z0h7">day, every store owner asks the</span></div>
    <div data-hf-id="hf-r0en" id="cap-2" class="cap"><span data-hf-id="hf-m135">same question.</span></div>
    <div data-hf-id="hf-n2am" id="cap-3" class="cap"><span data-hf-id="hf-13e1">Where is my money right now?</span></div>
    <div data-hf-id="hf-vq6h" id="cap-4" class="cap"><span data-hf-id="hf-xe1e">Cash and wallet answers that.</span></div>
    <div data-hf-id="hf-uyio" id="cap-5" class="cap"><span data-hf-id="hf-kezd">It follows every peso, from the</span></div>
    <div data-hf-id="hf-3mej" id="cap-6" class="cap"><span data-hf-id="hf-lm2n">moment a customer pays, to the</span></div>
    <div data-hf-id="hf-zoai" id="cap-7" class="cap"><span data-hf-id="hf-wf32">drawer, to the bank, and to</span></div>
    <div data-hf-id="hf-ajs5" id="cap-8" class="cap"><span data-hf-id="hf-53or">the owner.</span></div>
    <div data-hf-id="hf-9s4c" id="cap-9" class="cap"><span data-hf-id="hf-xgm9">It lives under five tabs.</span></div>
    <div data-hf-id="hf-u29g" id="cap-10" class="cap"><span data-hf-id="hf-0fzh">Today's drawer.</span></div>
    <div data-hf-id="hf-utx9" id="cap-11" class="cap"><span data-hf-id="hf-oh56">Where money is.</span></div>
    <div data-hf-id="hf-ys1a" id="cap-12" class="cap"><span data-hf-id="hf-1nee">Cash in and out.</span></div>
    <div data-hf-id="hf-2q5b" id="cap-13" class="cap"><span data-hf-id="hf-8dw7">Shifts and counts.</span></div>
    <div data-hf-id="hf-8vv4" id="cap-14" class="cap"><span data-hf-id="hf-2bjn">And Cash on hand.</span></div>
    <div data-hf-id="hf-9nix" id="cap-15" class="cap"><span data-hf-id="hf-2aiq">Let's walk through them, one role</span></div>
    <div data-hf-id="hf-dlmy" id="cap-16" class="cap"><span data-hf-id="hf-jmba">at a time.</span></div>
    <div data-hf-id="hf-hjqz" id="cap-17" class="cap"><span data-hf-id="hf-ew2t">First, three words you will hear</span></div>
    <div data-hf-id="hf-lhv0" id="cap-18" class="cap"><span data-hf-id="hf-k8w3">a lot.</span></div>
    <div data-hf-id="hf-m9it" id="cap-19" class="cap"><span data-hf-id="hf-c4jc">The cash drawer is the physical</span></div>
    <div data-hf-id="hf-35ut" id="cap-20" class="cap"><span data-hf-id="hf-gz4z">cash in the store.</span></div>
    <div data-hf-id="hf-2e70" id="cap-21" class="cap"><span data-hf-id="hf-snd1">Each cashier has their own tray,</span></div>
    <div data-hf-id="hf-d9on" id="cap-22" class="cap"><span data-hf-id="hf-y594">and together they make the store's</span></div>
    <div data-hf-id="hf-73yu" id="cap-23" class="cap"><span data-hf-id="hf-xqny">drawer.</span></div>
    <div data-hf-id="hf-hzgh" id="cap-24" class="cap"><span data-hf-id="hf-cbzo">Payment channels are where non cash</span></div>
    <div data-hf-id="hf-h7so" id="cap-25" class="cap"><span data-hf-id="hf-pdkb">payments land, like a card terminal,</span></div>
    <div data-hf-id="hf-pvoj" id="cap-26" class="cap"><span data-hf-id="hf-6bbz">GCash, or a bank.</span></div>
    <div data-hf-id="hf-lxki" id="cap-27" class="cap"><span data-hf-id="hf-l882">And Cash on hand is the</span></div>
    <div data-hf-id="hf-bq99" id="cap-28" class="cap"><span data-hf-id="hf-5z0h">business's cash that the owner holds,</span></div>
    <div data-hf-id="hf-aylg" id="cap-29" class="cap"><span data-hf-id="hf-ps6v">outside of every store.</span></div>
    <div data-hf-id="hf-fasq" id="cap-30" class="cap"><span data-hf-id="hf-68gr">One more idea.</span></div>
    <div data-hf-id="hf-j8wr" id="cap-31" class="cap"><span data-hf-id="hf-hzmt">Expected is what the app says</span></div>
    <div data-hf-id="hf-al0w" id="cap-32" class="cap"><span data-hf-id="hf-jfoc">should be in the drawer.</span></div>
    <div data-hf-id="hf-bcop" id="cap-33" class="cap"><span data-hf-id="hf-if24">Counted is what you actually count.</span></div>
    <div data-hf-id="hf-2osu" id="cap-34" class="cap"><span data-hf-id="hf-8igy">If counted is less, you are</span></div>
    <div data-hf-id="hf-6mwv" id="cap-35" class="cap"><span data-hf-id="hf-a8lh">short.</span></div>
    <div data-hf-id="hf-vrf8" id="cap-36" class="cap"><span data-hf-id="hf-hs73">If it is more, you are</span></div>
    <div data-hf-id="hf-wj31" id="cap-37" class="cap"><span data-hf-id="hf-97cn">over.</span></div>
    <div data-hf-id="hf-6qea" id="cap-38" class="cap"><span data-hf-id="hf-lnkf">Four roles use this, and each</span></div>
    <div data-hf-id="hf-aoib" id="cap-39" class="cap"><span data-hf-id="hf-vcwy">one sees a different part.</span></div>
    <div data-hf-id="hf-rkub" id="cap-40" class="cap"><span data-hf-id="hf-15t0">A cashier handles only their own</span></div>
    <div data-hf-id="hf-nmqa" id="cap-41" class="cap"><span data-hf-id="hf-y8nz">shift.</span></div>
    <div data-hf-id="hf-jom9" id="cap-42" class="cap"><span data-hf-id="hf-3t78">A supervisor watches the whole store</span></div>
    <div data-hf-id="hf-iwyg" id="cap-43" class="cap"><span data-hf-id="hf-ypsg">drawer, and checks the cashiers' counts.</span></div>
    <div data-hf-id="hf-eyuf" id="cap-44" class="cap"><span data-hf-id="hf-jycg">A manager does that too, and</span></div>
    <div data-hf-id="hf-b0qe" id="cap-45" class="cap"><span data-hf-id="hf-r0k7">also ends the store's day, and</span></div>
    <div data-hf-id="hf-4v0l" id="cap-46" class="cap"><span data-hf-id="hf-t65t">records money in and out.</span></div>
    <div data-hf-id="hf-43cs" id="cap-47" class="cap"><span data-hf-id="hf-xh8e">The owner, or an admin, sees</span></div>
    <div data-hf-id="hf-058r" id="cap-48" class="cap"><span data-hf-id="hf-fhpu">every store, holds Cash on hand,</span></div>
    <div data-hf-id="hf-w74q" id="cap-49" class="cap"><span data-hf-id="hf-yhch">and is the only one who</span></div>
    <div data-hf-id="hf-q5e0" id="cap-50" class="cap"><span data-hf-id="hf-4p59">moves money between stores.</span></div>
    <div data-hf-id="hf-qx1t" id="cap-51" class="cap"><span data-hf-id="hf-moub">Here is a cashier's day.</span></div>
    <div data-hf-id="hf-x2rm" id="cap-52" class="cap"><span data-hf-id="hf-6e5s">Open Today's drawer, and under My</span></div>
    <div data-hf-id="hf-10vn" id="cap-53" class="cap"><span data-hf-id="hf-gxv6">shift, choose Start my shift.</span></div>
    <div data-hf-id="hf-dje4" id="cap-54" class="cap"><span data-hf-id="hf-r89f">Enter your opening cash, here five</span></div>
    <div data-hf-id="hf-eb1x" id="cap-55" class="cap"><span data-hf-id="hf-f3jp">hundred pesos.</span></div>
    <div data-hf-id="hf-i95y" id="cap-56" class="cap"><span data-hf-id="hf-puxk">You can also start from the</span></div>
    <div data-hf-id="hf-m79z" id="cap-57" class="cap"><span data-hf-id="hf-neus">Sales page.</span></div>
    <div data-hf-id="hf-o7vs" id="cap-58" class="cap"><span data-hf-id="hf-5dfh">Now sell as usual.</span></div>
    <div data-hf-id="hf-zhg9" id="cap-59" class="cap"><span data-hf-id="hf-fm72">Every cash sale adds to your</span></div>
    <div data-hf-id="hf-xil5" id="cap-60" class="cap"><span data-hf-id="hf-p11t">tray's Expected.</span></div>
    <div data-hf-id="hf-wqxc" id="cap-61" class="cap"><span data-hf-id="hf-e914">When you are done, choose End</span></div>
    <div data-hf-id="hf-5et7" id="cap-62" class="cap"><span data-hf-id="hf-x877">my shift, and count the cash</span></div>
    <div data-hf-id="hf-1gp6" id="cap-63" class="cap"><span data-hf-id="hf-6ykj">in your tray.</span></div>
    <div data-hf-id="hf-iozh" id="cap-64" class="cap"><span data-hf-id="hf-svlk">You don't need a PIN.</span></div>
    <div data-hf-id="hf-hxbo" id="cap-65" class="cap"><span data-hf-id="hf-mq2w">If your count matches, you are</span></div>
    <div data-hf-id="hf-ql7j" id="cap-66" class="cap"><span data-hf-id="hf-sqnt">done.</span></div>
    <div data-hf-id="hf-mn3i" id="cap-67" class="cap"><span data-hf-id="hf-tgvu">If it is short or over,</span></div>
    <div data-hf-id="hf-oy6p" id="cap-68" class="cap"><span data-hf-id="hf-mazy">the shift shows Needs review, and</span></div>
    <div data-hf-id="hf-o6iw" id="cap-69" class="cap"><span data-hf-id="hf-hdpm">a supervisor checks it.</span></div>
    <div data-hf-id="hf-dpi6" id="cap-70" class="cap"><span data-hf-id="hf-nzqw">You can keep working meanwhile.</span></div>
    <div data-hf-id="hf-hnm7" id="cap-71" class="cap"><span data-hf-id="hf-bfde">Every shift follows the same path.</span></div>
    <div data-hf-id="hf-6s4k" id="cap-72" class="cap"><span data-hf-id="hf-5sl7">It starts Open.</span></div>
    <div data-hf-id="hf-9re5" id="cap-73" class="cap"><span data-hf-id="hf-ws1a">When the cashier counts, it becomes</span></div>
    <div data-hf-id="hf-qbi2" id="cap-74" class="cap"><span data-hf-id="hf-hdkb">Ended.</span></div>
    <div data-hf-id="hf-u9m3" id="cap-75" class="cap"><span data-hf-id="hf-zveu">If the count is off, it</span></div>
    <div data-hf-id="hf-llq8" id="cap-76" class="cap"><span data-hf-id="hf-cqr3">goes to Needs review.</span></div>
    <div data-hf-id="hf-mde1" id="cap-77" class="cap"><span data-hf-id="hf-04xr">A supervisor then approves it, or</span></div>
    <div data-hf-id="hf-553q" id="cap-78" class="cap"><span data-hf-id="hf-3sfq">sends it back for a recount.</span></div>
    <div data-hf-id="hf-937r" id="cap-79" class="cap"><span data-hf-id="hf-f2ji">When it is sent back, the</span></div>
    <div data-hf-id="hf-lxkn" id="cap-80" class="cap"><span data-hf-id="hf-mnxk">cashier counts again, and the shift</span></div>
    <div data-hf-id="hf-hzgm" id="cap-81" class="cap"><span data-hf-id="hf-tjx4">goes through the same steps.</span></div>
    <div data-hf-id="hf-e1cl" id="cap-82" class="cap"><span data-hf-id="hf-6hb2">If a cashier forgets to end</span></div>
    <div data-hf-id="hf-b230" id="cap-83" class="cap"><span data-hf-id="hf-hrxc">their shift, it shows under Forgotten</span></div>
    <div data-hf-id="hf-yjkj" id="cap-84" class="cap"><span data-hf-id="hf-ul9a">shifts, so someone can end it</span></div>
    <div data-hf-id="hf-ulgi" id="cap-85" class="cap"><span data-hf-id="hf-oy2w">for them.</span></div>
    <div data-hf-id="hf-qnch" id="cap-86" class="cap"><span data-hf-id="hf-nygj">And if a shift was ended</span></div>
    <div data-hf-id="hf-pvoo" id="cap-87" class="cap"><span data-hf-id="hf-k4et">on another device, the Sales page</span></div>
    <div data-hf-id="hf-uhz3" id="cap-88" class="cap"><span data-hf-id="hf-t8th">tells you, instead of letting you</span></div>
    <div data-hf-id="hf-qjv2" id="cap-89" class="cap"><span data-hf-id="hf-dmr7">sell on a closed shift.</span></div>
    <div data-hf-id="hf-24ho" id="cap-90" class="cap"><span data-hf-id="hf-g58w">A supervisor opens Today's drawer and</span></div>
    <div data-hf-id="hf-2w5h" id="cap-91" class="cap"><span data-hf-id="hf-8r3e">sees the whole store.</span></div>
    <div data-hf-id="hf-6u9i" id="cap-92" class="cap"><span data-hf-id="hf-z3wq">Cash in drawers is every tray</span></div>
    <div data-hf-id="hf-asdj" id="cap-93" class="cap"><span data-hf-id="hf-5ejk">added up.</span></div>
    <div data-hf-id="hf-eqhk" id="cap-94" class="cap"><span data-hf-id="hf-x561">Cash sales today is what went</span></div>
    <div data-hf-id="hf-hpr5" id="cap-95" class="cap"><span data-hf-id="hf-ur20">into the drawers.</span></div>
    <div data-hf-id="hf-lnv6" id="cap-96" class="cap"><span data-hf-id="hf-dwa7">Card, e-wallet and bank is money</span></div>
    <div data-hf-id="hf-plz7" id="cap-97" class="cap"><span data-hf-id="hf-bzqo">that went past the drawer, straight</span></div>
    <div data-hf-id="hf-aow4" id="cap-98" class="cap"><span data-hf-id="hf-t7xn">into a channel.</span></div>
    <div data-hf-id="hf-bgjx" id="cap-99" class="cap"><span data-hf-id="hf-8ns9">Counts off shows how many counts</span></div>
    <div data-hf-id="hf-wyis" id="cap-100" class="cap"><span data-hf-id="hf-hszo">need a review.</span></div>
    <div data-hf-id="hf-xq6l" id="cap-101" class="cap"><span data-hf-id="hf-wpe7">A supervisor can set the opening</span></div>
    <div data-hf-id="hf-1oam" id="cap-102" class="cap"><span data-hf-id="hf-rt7x">cash, and do a spot check</span></div>
    <div data-hf-id="hf-7u0f" id="cap-103" class="cap"><span data-hf-id="hf-meh0">any time.</span></div>
    <div data-hf-id="hf-bs4g" id="cap-104" class="cap"><span data-hf-id="hf-m7co">A spot check counts the drawer</span></div>
    <div data-hf-id="hf-cjs9" id="cap-105" class="cap"><span data-hf-id="hf-29zm">without ending anything.</span></div>
    <div data-hf-id="hf-ghwa" id="cap-106" class="cap"><span data-hf-id="hf-0mgv">Then, on Shifts and counts, open</span></div>
    <div data-hf-id="hf-kg0b" id="cap-107" class="cap"><span data-hf-id="hf-je93">a count that needs review.</span></div>
    <div data-hf-id="hf-oe4c" id="cap-108" class="cap"><span data-hf-id="hf-3tep">Look at Expected, Counted, and the</span></div>
    <div data-hf-id="hf-p5s5" id="cap-109" class="cap"><span data-hf-id="hf-j40o">Difference.</span></div>
    <div data-hf-id="hf-ktkv" id="cap-110" class="cap"><span data-hf-id="hf-e1j3">Approve it with a note, or</span></div>
    <div data-hf-id="hf-gvgu" id="cap-111" class="cap"><span data-hf-id="hf-aotb">send it back for a recount.</span></div>
    <div data-hf-id="hf-cxct" id="cap-112" class="cap"><span data-hf-id="hf-tboc">A supervisor only sees their own</span></div>
    <div data-hf-id="hf-c5p0" id="cap-113" class="cap"><span data-hf-id="hf-s8kq">team.</span></div>
    <div data-hf-id="hf-zn6j" id="cap-114" class="cap"><span data-hf-id="hf-vg7r">When every cashier has ended their</span></div>
    <div data-hf-id="hf-vp2i" id="cap-115" class="cap"><span data-hf-id="hf-82u9">shift, the manager ends the store's</span></div>
    <div data-hf-id="hf-pjcp" id="cap-116" class="cap"><span data-hf-id="hf-k845">day.</span></div>
    <div data-hf-id="hf-orow" id="cap-117" class="cap"><span data-hf-id="hf-zfbk">Choose End the store's day, and</span></div>
    <div data-hf-id="hf-c96f" id="cap-118" class="cap"><span data-hf-id="hf-fwwd">enter the final count.</span></div>
    <div data-hf-id="hf-8b2e" id="cap-119" class="cap"><span data-hf-id="hf-0zb5">Then decide where the cash goes.</span></div>
    <div data-hf-id="hf-4mnu" id="cap-120" class="cap"><span data-hf-id="hf-x73u">Cash out sends it to Cash</span></div>
    <div data-hf-id="hf-8krv" id="cap-121" class="cap"><span data-hf-id="hf-55sm">on hand, for the owner.</span></div>
    <div data-hf-id="hf-zww0" id="cap-122" class="cap"><span data-hf-id="hf-urge">The drawer starts tomorrow empty.</span></div>
    <div data-hf-id="hf-0ojt" id="cap-123" class="cap"><span data-hf-id="hf-m1lo">Keep as opening leaves it in</span></div>
    <div data-hf-id="hf-s0ny" id="cap-124" class="cap"><span data-hf-id="hf-mqjl">the drawer, as tomorrow's opening cash.</span></div>
    <div data-hf-id="hf-vyrz" id="cap-125" class="cap"><span data-hf-id="hf-xofa">Once the day is closed, nothing</span></div>
    <div data-hf-id="hf-l3ac" id="cap-126" class="cap"><span data-hf-id="hf-g09z">more can be added to it.</span></div>
    <div data-hf-id="hf-o2jx" id="cap-127" class="cap"><span data-hf-id="hf-kv4w">If you made a mistake, a</span></div>
    <div data-hf-id="hf-w29e" id="cap-128" class="cap"><span data-hf-id="hf-jvaa">manager or admin can reopen the</span></div>
    <div data-hf-id="hf-27z7" id="cap-129" class="cap"><span data-hf-id="hf-wca0">day, with a reason.</span></div>
    <div data-hf-id="hf-shpx" id="cap-130" class="cap"><span data-hf-id="hf-k8ni">Not all money comes from sales.</span></div>
    <div data-hf-id="hf-rq24" id="cap-131" class="cap"><span data-hf-id="hf-6hsi">On Cash in and out, a</span></div>
    <div data-hf-id="hf-2ljr" id="cap-132" class="cap"><span data-hf-id="hf-5ml1">manager records the rest.</span></div>
    <div data-hf-id="hf-wfty" id="cap-133" class="cap"><span data-hf-id="hf-zkq6">Cash in, for example Added float,</span></div>
    <div data-hf-id="hf-7bbl" id="cap-134" class="cap"><span data-hf-id="hf-8xa7">when you put in change or</span></div>
    <div data-hf-id="hf-6jns" id="cap-135" class="cap"><span data-hf-id="hf-0ftg">small bills.</span></div>
    <div data-hf-id="hf-f7jn" id="cap-136" class="cap"><span data-hf-id="hf-ji7v">Cash out, for example Owner took</span></div>
    <div data-hf-id="hf-b9fm" id="cap-137" class="cap"><span data-hf-id="hf-p18w">cash.</span></div>
    <div data-hf-id="hf-124d" id="cap-138" class="cap"><span data-hf-id="hf-apxm">Move, to send money between the</span></div>
    <div data-hf-id="hf-0agk" id="cap-139" class="cap"><span data-hf-id="hf-bmuh">drawer and the store's own channels,</span></div>
    <div data-hf-id="hf-t1nc" id="cap-140" class="cap"><span data-hf-id="hf-0kz0">like depositing cash into the bank.</span></div>
    <div data-hf-id="hf-w0wx" id="cap-141" class="cap"><span data-hf-id="hf-kqak">Before you save, the app shows</span></div>
    <div data-hf-id="hf-zz0y" id="cap-142" class="cap"><span data-hf-id="hf-v0e6">the balance before and after, so</span></div>
    <div data-hf-id="hf-3x4z" id="cap-143" class="cap"><span data-hf-id="hf-uttg">you see exactly what changes.</span></div>
    <div data-hf-id="hf-gfng" id="cap-144" class="cap"><span data-hf-id="hf-fgc3">Other pages add lines here too.</span></div>
    <div data-hf-id="hf-h7b9" id="cap-145" class="cap"><span data-hf-id="hf-jmfo">An expense, a supplier payment, or</span></div>
    <div data-hf-id="hf-l5fa" id="cap-146" class="cap"><span data-hf-id="hf-bbsn">a loan payment all show up,</span></div>
    <div data-hf-id="hf-p3jb" id="cap-147" class="cap"><span data-hf-id="hf-aum3">because they also took money from</span></div>
    <div data-hf-id="hf-1m1s" id="cap-148" class="cap"><span data-hf-id="hf-rhnl">the drawer.</span></div>
    <div data-hf-id="hf-2dpl" id="cap-149" class="cap"><span data-hf-id="hf-mkb0">Where money is puts it all</span></div>
    <div data-hf-id="hf-gwpf" id="cap-150" class="cap"><span data-hf-id="hf-f5li">on one screen.</span></div>
    <div data-hf-id="hf-cyle" id="cap-151" class="cap"><span data-hf-id="hf-tsur">For each store, you see the</span></div>
    <div data-hf-id="hf-90hd" id="cap-152" class="cap"><span data-hf-id="hf-uich">cash drawer, every e-wallet, and every</span></div>
    <div data-hf-id="hf-88tk" id="cap-153" class="cap"><span data-hf-id="hf-pgaj">bank and card terminal, each with</span></div>
    <div data-hf-id="hf-4apj" id="cap-154" class="cap"><span data-hf-id="hf-niyt">its balance and a subtotal.</span></div>
    <div data-hf-id="hf-0cli" id="cap-155" class="cap"><span data-hf-id="hf-jt8a">The owner sees every store side</span></div>
    <div data-hf-id="hf-wehh" id="cap-156" class="cap"><span data-hf-id="hf-ngh2">by side, plus Cash on hand.</span></div>
    <div data-hf-id="hf-tf7w" id="cap-157" class="cap"><span data-hf-id="hf-6s28">This is the answer to the</span></div>
    <div data-hf-id="hf-ph3v" id="cap-158" class="cap"><span data-hf-id="hf-1tkc">question we started with.</span></div>
    <div data-hf-id="hf-lizu" id="cap-159" class="cap"><span data-hf-id="hf-a8v1">Where is my money right now?</span></div>
    <div data-hf-id="hf-yze6" id="cap-160" class="cap"><span data-hf-id="hf-5a4w">Now the owner's part.</span></div>
    <div data-hf-id="hf-2xi7" id="cap-161" class="cap"><span data-hf-id="hf-oey2">Money only moves between stores that</span></div>
    <div data-hf-id="hf-yblg" id="cap-162" class="cap"><span data-hf-id="hf-79hv">allow it.</span></div>
    <div data-hf-id="hf-v1a5" id="cap-163" class="cap"><span data-hf-id="hf-0epb">Go to Inventory, then Locations.</span></div>
    <div data-hf-id="hf-ble2" id="cap-164" class="cap"><span data-hf-id="hf-jl2g">Edit each store, and turn on</span></div>
    <div data-hf-id="hf-hr3v" id="cap-165" class="cap"><span data-hf-id="hf-3jpi">Can transfer money.</span></div>
    <div data-hf-id="hf-axlc" id="cap-166" class="cap"><span data-hf-id="hf-5sqi">Do this for both stores.</span></div>
    <div data-hf-id="hf-7na1" id="cap-167" class="cap"><span data-hf-id="hf-ej90">One more rule.</span></div>
    <div data-hf-id="hf-qezq" id="cap-168" class="cap"><span data-hf-id="hf-9a1t">You can't move money into or</span></div>
    <div data-hf-id="hf-ud3r" id="cap-169" class="cap"><span data-hf-id="hf-dvdm">out of a day that has</span></div>
    <div data-hf-id="hf-0euh" id="cap-170" class="cap"><span data-hf-id="hf-8ftz">already been ended.</span></div>
    <div data-hf-id="hf-zn6o" id="cap-171" class="cap"><span data-hf-id="hf-rwpn">There are three ways to move</span></div>
    <div data-hf-id="hf-8b2j" id="cap-172" class="cap"><span data-hf-id="hf-tie4">money to another store.</span></div>
    <div data-hf-id="hf-4cyi" id="cap-173" class="cap"><span data-hf-id="hf-w00m">Only one of them passes through</span></div>
    <div data-hf-id="hf-ll8t" id="cap-174" class="cap"><span data-hf-id="hf-7sv2">Cash on hand.</span></div>
    <div data-hf-id="hf-ktl0" id="cap-175" class="cap"><span data-hf-id="hf-dzwf">One.</span></div>
    <div data-hf-id="hf-vp2n" id="cap-176" class="cap"><span data-hf-id="hf-uc6q">Transfer, on Cash in and out.</span></div>
    <div data-hf-id="hf-pjcu" id="cap-177" class="cap"><span data-hf-id="hf-3xta">Pick the other store and the</span></div>
    <div data-hf-id="hf-rug1" id="cap-178" class="cap"><span data-hf-id="hf-nqux">place, drawer or channel, and the</span></div>
    <div data-hf-id="hf-r2s8" id="cap-179" class="cap"><span data-hf-id="hf-i1pl">money goes straight there.</span></div>
    <div data-hf-id="hf-rgcs" id="cap-180" class="cap"><span data-hf-id="hf-xck1">Two.</span></div>
    <div data-hf-id="hf-s80l" id="cap-181" class="cap"><span data-hf-id="hf-tf0e">Owner took cash, and choose Into</span></div>
    <div data-hf-id="hf-w64m" id="cap-182" class="cap"><span data-hf-id="hf-mgtw">the other store's drawer.</span></div>
    <div data-hf-id="hf-048n" id="cap-183" class="cap"><span data-hf-id="hf-iase">The owner carries the cash over.</span></div>
    <div data-hf-id="hf-69yg" id="cap-184" class="cap"><span data-hf-id="hf-gj4h">This only works from the cash</span></div>
    <div data-hf-id="hf-71m9" id="cap-185" class="cap"><span data-hf-id="hf-p1k2">drawer.</span></div>
    <div data-hf-id="hf-azqa" id="cap-186" class="cap"><span data-hf-id="hf-essz">Three.</span></div>
    <div data-hf-id="hf-exub" id="cap-187" class="cap"><span data-hf-id="hf-iumn">Through Cash on hand.</span></div>
    <div data-hf-id="hf-00r8" id="cap-188" class="cap"><span data-hf-id="hf-wqxo">The cash comes in first, and</span></div>
    <div data-hf-id="hf-0sf1" id="cap-189" class="cap"><span data-hf-id="hf-wpa5">later the owner chooses Move to</span></div>
    <div data-hf-id="hf-b9fr" id="cap-190" class="cap"><span data-hf-id="hf-pj8v">a store, and picks its drawer</span></div>
    <div data-hf-id="hf-7bbq" id="cap-191" class="cap"><span data-hf-id="hf-j7xh">or one of its channels.</span></div>
    <div data-hf-id="hf-3d7p" id="cap-192" class="cap"><span data-hf-id="hf-ebl2">Cash on hand is the owner's</span></div>
    <div data-hf-id="hf-2ljw" id="cap-193" class="cap"><span data-hf-id="hf-kqfy">safe.</span></div>
    <div data-hf-id="hf-q31f" id="cap-194" class="cap"><span data-hf-id="hf-we2v">Money gets in two ways.</span></div>
    <div data-hf-id="hf-jxbm" id="cap-195" class="cap"><span data-hf-id="hf-3x3i">When a manager chooses Cash out</span></div>
    <div data-hf-id="hf-fz7l" id="cap-196" class="cap"><span data-hf-id="hf-9p4o">at the end of the day.</span></div>
    <div data-hf-id="hf-f7js" id="cap-197" class="cap"><span data-hf-id="hf-luju">Or when the owner collects an</span></div>
    <div data-hf-id="hf-jtu7" id="cap-198" class="cap"><span data-hf-id="hf-5msi">approved shift, from Waiting to collect.</span></div>
    <div data-hf-id="hf-fvq6" id="cap-199" class="cap"><span data-hf-id="hf-0579">Money goes out three ways.</span></div>
    <div data-hf-id="hf-xrav" id="cap-200" class="cap"><span data-hf-id="hf-33ql">Move to a store sends it</span></div>
    <div data-hf-id="hf-tt6u" id="cap-201" class="cap"><span data-hf-id="hf-cv91">back to a drawer or channel.</span></div>
    <div data-hf-id="hf-pv2t" id="cap-202" class="cap"><span data-hf-id="hf-snp1">Correction fixes a mistake.</span></div>
    <div data-hf-id="hf-p3f0" id="cap-203" class="cap"><span data-hf-id="hf-g2s6">And Owner used it means the</span></div>
    <div data-hf-id="hf-ckwj" id="cap-204" class="cap"><span data-hf-id="hf-wbu5">owner spent it outside the business.</span></div>
    <div data-hf-id="hf-8msi" id="cap-205" class="cap"><span data-hf-id="hf-5qvo">Remember this.</span></div>
    <div data-hf-id="hf-4ooh" id="cap-206" class="cap"><span data-hf-id="hf-k5qv">Collecting cash, and moving it back</span></div>
    <div data-hf-id="hf-3x0o" id="cap-207" class="cap"><span data-hf-id="hf-00ce">to a store, does not change</span></div>
    <div data-hf-id="hf-6bpb" id="cap-208" class="cap"><span data-hf-id="hf-x204">the books.</span></div>
    <div data-hf-id="hf-2dla" id="cap-209" class="cap"><span data-hf-id="hf-9157">It is still the business's money.</span></div>
    <div data-hf-id="hf-dy7w" id="cap-210" class="cap"><span data-hf-id="hf-cheu">Only Owner used it takes money</span></div>
    <div data-hf-id="hf-epvp" id="cap-211" class="cap"><span data-hf-id="hf-upl3">out of the business.</span></div>
    <div data-hf-id="hf-kvli" id="cap-212" class="cap"><span data-hf-id="hf-1xej">Finally, the big picture.</span></div>
    <div data-hf-id="hf-otpj" id="cap-213" class="cap"><span data-hf-id="hf-tyl1">Under Finance, Money in and out</span></div>
    <div data-hf-id="hf-srtk" id="cap-214" class="cap"><span data-hf-id="hf-n7ct">shows your cash flow.</span></div>
    <div data-hf-id="hf-tjhd" id="cap-215" class="cap"><span data-hf-id="hf-poxu">Money in is sales, credit payments,</span></div>
    <div data-hf-id="hf-xhle" id="cap-216" class="cap"><span data-hf-id="hf-yhvg">loans, and money the owner put</span></div>
    <div data-hf-id="hf-1fpf" id="cap-217" class="cap"><span data-hf-id="hf-txs4">in.</span></div>
    <div data-hf-id="hf-mimc" id="cap-218" class="cap"><span data-hf-id="hf-li2l">Money out is expenses, suppliers, loan</span></div>
    <div data-hf-id="hf-naa5" id="cap-219" class="cap"><span data-hf-id="hf-k2tb">payments, equipment, and owner draws.</span></div>
    <div data-hf-id="hf-h9fx" id="cap-220" class="cap"><span data-hf-id="hf-oe5k">Moving money between your own drawers,</span></div>
    <div data-hf-id="hf-ghs4" id="cap-221" class="cap"><span data-hf-id="hf-rrll">channels, and Cash on hand is</span></div>
    <div data-hf-id="hf-p5nz" id="cap-222" class="cap"><span data-hf-id="hf-1sum">not on this list, because it</span></div>
    <div data-hf-id="hf-l7jy" id="cap-223" class="cap"><span data-hf-id="hf-0bo9">never left the business.</span></div>
    <div data-hf-id="hf-tvft" id="cap-224" class="cap"><span data-hf-id="hf-j3pt">And there is a section called</span></div>
    <div data-hf-id="hf-t3s0" id="cap-225" class="cap"><span data-hf-id="hf-m4zf">Why profit and money are different.</span></div>
    <div data-hf-id="hf-3z9n" id="cap-226" class="cap"><span data-hf-id="hf-hlrg">You can make a profit, and</span></div>
    <div data-hf-id="hf-015m" id="cap-227" class="cap"><span data-hf-id="hf-49rr">still be short on cash, if</span></div>
    <div data-hf-id="hf-8p1h" id="cap-228" class="cap"><span data-hf-id="hf-15ao">it is tied up in stock</span></div>
    <div data-hf-id="hf-7xdo" id="cap-229" class="cap"><span data-hf-id="hf-b2g4">or in customer credit.</span></div>
    <div data-hf-id="hf-lmcy" id="cap-230" class="cap"><span data-hf-id="hf-qrqi">So, which way to move money?</span></div>
    <div data-hf-id="hf-rs2r" id="cap-231" class="cap"><span data-hf-id="hf-h4sw">If the other store needs it</span></div>
    <div data-hf-id="hf-gwl4" id="cap-232" class="cap"><span data-hf-id="hf-xe31">now, use Transfer.</span></div>
    <div data-hf-id="hf-ho8x" id="cap-233" class="cap"><span data-hf-id="hf-rlbp">If you are carrying cash from</span></div>
    <div data-hf-id="hf-90d2" id="cap-234" class="cap"><span data-hf-id="hf-4wvu">one drawer to another, use Owner</span></div>
    <div data-hf-id="hf-cyh3" id="cap-235" class="cap"><span data-hf-id="hf-m6lx">took cash.</span></div>
    <div data-hf-id="hf-4al8" id="cap-236" class="cap"><span data-hf-id="hf-cl6c">If you collect first and decide</span></div>
    <div data-hf-id="hf-5291" id="cap-237" class="cap"><span data-hf-id="hf-wnjd">later, use Cash on hand.</span></div>
    <div data-hf-id="hf-u6re" id="cap-238" class="cap"><span data-hf-id="hf-yacr">To recap.</span></div>
    <div data-hf-id="hf-y4vf" id="cap-239" class="cap"><span data-hf-id="hf-7s1n">Cashiers start, sell, and count their</span></div>
    <div data-hf-id="hf-w60b" id="cap-240" class="cap"><span data-hf-id="hf-ewf1">own tray.</span></div>
    <div data-hf-id="hf-s7wa" id="cap-241" class="cap"><span data-hf-id="hf-rdhm">Supervisors check the drawer and the</span></div>
    <div data-hf-id="hf-o9s9" id="cap-242" class="cap"><span data-hf-id="hf-oe19">counts.</span></div>
    <div data-hf-id="hf-laio" id="cap-243" class="cap"><span data-hf-id="hf-qpdf">Managers end the store's day and</span></div>
    <div data-hf-id="hf-hcen" id="cap-244" class="cap"><span data-hf-id="hf-2mss">record money in and out.</span></div>
    <div data-hf-id="hf-deam" id="cap-245" class="cap"><span data-hf-id="hf-3l2w">And the owner sees every store,</span></div>
    <div data-hf-id="hf-9g6l" id="cap-246" class="cap"><span data-hf-id="hf-momx">keeps Cash on hand, and moves</span></div>
    <div data-hf-id="hf-8ois" id="cap-247" class="cap"><span data-hf-id="hf-pu3j">money between stores.</span></div>
    <div data-hf-id="hf-nllv" id="cap-248" class="cap"><span data-hf-id="hf-aeed">That's Cash and wallet.</span></div>
  </div>
